<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題集</title>
<link rel="stylesheet" href="login.css">
<style>
  :root { --ink: #1f2933; --sub: #52606d; --line: #d9dee5; --bg: #fbfaf7; --accent: #2f6f4f; --accent-soft: #e5f0ea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Meiryo UI", Meiryo, sans-serif; font-size: 18px; line-height: 1.6; }
  header { padding: 16px 18px 10px; border-bottom: 2px solid var(--ink); }
  header h1 { margin: 0; font-size: 24px; }
  main { padding: 16px 18px 60px; }
  h2 { font-size: 19px; margin: 18px 0 10px; }
  .muted { color: var(--sub); }
  .sheet { display: block; width: 100%; text-align: left; font: inherit; padding: 14px 16px; margin-bottom: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .sheet.on { border: 2px solid var(--accent); background: var(--accent-soft); }
  .sheet small { display: block; color: var(--sub); font-size: 15px; }
  .big { display: block; width: 100%; font: inherit; font-size: 20px; padding: 16px; border-radius: 8px; text-align: center; cursor: pointer;
    border: 1px solid var(--accent); background: #fff; color: var(--accent); margin-top: 12px; }
  .big.primary { background: var(--accent); color: #fff; }
  .big:disabled { opacity: .45; }
  input[type=file] { display: none; }
  .photo { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; padding: 12px; margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .photo img { width: 110px; border: 1px solid var(--line); display: block; }
  .photo label { display: block; font-size: 15px; color: var(--sub); }
  .photo select, .photo input { font: inherit; font-size: 18px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .photo select { width: 100%; }
  .photo input { width: 4.2em; text-align: center; }
  .photo .range { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .photo .del { margin-top: 8px; font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--sub); padding: 4px 12px; }
  .photo .err { color: #b42318; font-size: 15px; }
  .done { padding: 30px 0; text-align: center; font-size: 22px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 22px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<header><h1>用紙を送る</h1></header>
<main id="main"><p class="muted">読み込み中…</p></main>
<input type="file" id="camera" accept="image/*" capture="environment" onchange="addPhotos(this)">
<input type="file" id="library" accept="image/*" multiple onchange="addPhotos(this)">
<div id="toast"></div>

<script src="api.js?v=20261122-3"></script>
<script>
/* 古い画面が残っていたら1回だけ読み直す（GitHub Pages のキャッシュ対策）。直すたびに BUILD を変える */
const BUILD = '20261122-3';
(function () {
  try {
    if (sessionStorage.getItem('reloaded') === BUILD) return;
    fetch(location.pathname + '?build=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      if (t.indexOf("const BUILD = '" + BUILD + "'") < 0) { sessionStorage.setItem('reloaded', BUILD); location.reload(); }
    }).catch(function () {});
  } catch (e) {}
})();
/* 写真1枚ごとに「用紙番号」と「その写真に写っている番号の範囲（From〜To）」を選んで送る */
let LIST = [], photos = [];
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2500);
}
function fail(e) { toast('エラー：' + (e && e.message ? e.message : e)); }
function shortLabel(s) {
  return s.label.replace(s.code, '').replace(/（\d+問）/, '').replace(/^[\s　]*(国語|数学|理科|社会|英語)[：:]/, '').replace(/[\s　]+/g, ' ').trim();
}
function sheetOf(row) { return LIST.find(function (s) { return s.row === Number(row); }); }
async function load() {
  try { LIST = await call('listSheets'); } catch (e) { return fail(e); }
  photos = [];
  render();
}
function check(p) {
  const s = sheetOf(p.row);
  if (!s) return '用紙番号を選ぶ';
  if (!(p.from >= 1 && p.to >= p.from && p.to <= s.count)) return '番号は 1〜' + s.count + ' の範囲で、From ≦ To';
  return '';
}
function render() {
  let h = '';
  if (!LIST.length) {
    h = '<p class="done">送る用紙はない</p><p class="muted">PCで問題用紙の「答えを見る」を押すと、ここに出る</p>' +
      '<button class="big" onclick="load()">もう一度さがす</button>';
    document.getElementById('main').innerHTML = h;
    return;
  }
  h += '<h2>1. ○×をつけた紙をとる</h2><p class="muted">紙全体が入るように、明るいところでとる。何枚でもよい（1回に6枚まで）</p>' +
    '<button class="big" onclick="document.getElementById(\'camera\').click()">カメラでとる</button>' +
    '<button class="big" onclick="document.getElementById(\'library\').click()">とった写真から選ぶ</button>';
  if (photos.length) {
    h += '<h2>2. 写真ごとに用紙番号と番号の範囲を選ぶ</h2>';
    h += photos.map(function (p, i) {
      const err = check(p);
      return '<div class="photo"><img src="' + p.url + '"><div>' +
        '<label>用紙番号</label><select onchange="setRow(' + i + ', this.value)">' +
        LIST.map(function (s) {
          return '<option value="' + s.row + '"' + (s.row === p.row ? ' selected' : '') + '>' + esc(s.code + '　' + shortLabel(s)) + '（' + s.count + '問）</option>';
        }).join('') + '</select>' +
        '<div class="range"><label>番号</label><input type="number" inputmode="numeric" value="' + p.from + '" onchange="setNum(' + i + ', \'from\', this.value)">' +
        '<span>〜</span><input type="number" inputmode="numeric" value="' + p.to + '" onchange="setNum(' + i + ', \'to\', this.value)"><span>番</span></div>' +
        (err ? '<div class="err">' + esc(err) + '</div>' : '') +
        '<button class="del" onclick="removePhoto(' + i + ')">この写真をけす</button></div></div>';
    }).join('');
  }
  const ok = photos.length && photos.every(function (p) { return !check(p); });
  h += '<h2>' + (photos.length ? '3' : '2') + '. 送る</h2><button class="big primary" id="sendBtn" onclick="send()" ' + (ok ? '' : 'disabled') + '>' +
    (photos.length ? photos.length + '枚 送る' : '送る') + '</button>';
  document.getElementById('main').innerHTML = h;
}
function setRow(i, row) {
  const p = photos[i], s = sheetOf(row);
  p.row = Number(row);
  if (s) { p.from = 1; p.to = s.count; }
  render();
}
function setNum(i, k, v) { photos[i][k] = Math.floor(Number(v)); render(); }
function removePhoto(i) { photos.splice(i, 1); render(); }
/* 新しい写真の初期値：直前の写真と同じ用紙で、その続きの番号から */
function nextDefault() {
  const last = photos[photos.length - 1];
  if (last && sheetOf(last.row)) {
    const s = sheetOf(last.row);
    const from = Math.min(last.to + 1, s.count);
    return { row: s.row, from: from, to: s.count };
  }
  return { row: LIST[0].row, from: 1, to: LIST[0].count };
}
/* 長い辺1600pxに縮めてJPEGにする */
function shrink(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('写真を読みこめない')); };
    img.src = url;
  });
}
async function addPhotos(input) {
  const files = Array.prototype.slice.call(input.files);
  input.value = '';
  try {
    const add = await Promise.all(files.map(shrink));
    add.forEach(function (u) {
      if (photos.length >= 6) return;
      const d = nextDefault();
      photos.push({ url: u, row: d.row, from: d.from, to: d.to });
    });
    if (photos.length >= 6) toast('1回に6枚まで');
  } catch (e) { fail(e); }
  render();
}
async function send() {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  let n = 0;
  try {
    for (let i = 0; i < photos.length; i++) {
      btn.textContent = '送っています… ' + (i + 1) + '/' + photos.length;
      const p = photos[i];
      await call('uploadPhoto', p.row, p.from, p.to, p.url);
      n++;
    }
    document.getElementById('main').innerHTML = '<p class="done">' + n + '枚 送った</p>' +
      photos.map(function (p) { const s = sheetOf(p.row); return '<p class="muted">' + esc(s ? s.code : '') + '　' + p.from + '〜' + p.to + '番</p>'; }).join('') +
      '<button class="big" onclick="load()">ほかの写真を送る</button>';
  } catch (e) {
    photos = photos.slice(n);
    fail(e);
    render();
    if (n) toast(n + '枚は送れた。のこり ' + photos.length + '枚をもう一度送る');
  }
}
startApp(function (title) {
  document.title = '用紙を送る';
  load();
});
</script>
</body>
</html>
