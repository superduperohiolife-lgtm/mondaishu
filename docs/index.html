<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結輝の2学期中間クエスト</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="quest.css?v=20261122-4">
</head>
<body>
<header class="q-header">
  <div class="q-brand">
    <!-- オリジナルSVGロゴ（山脈・コンパス・トレイル。実在ロゴ不使用） -->
    <svg class="q-logo-svg" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="#173227" stroke="#d99a26" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="M12 44 L25 22 L34 35 L41 25 L52 44 Z" fill="#3a7a5c"/>
      <path d="M25 22 L29 28 L25 27 L21 29 Z" fill="#f7f4ec"/>
      <path d="M41 25 L44 30 L41 29 L38 30 Z" fill="#f7f4ec"/>
      <path d="M18 46 Q29 41 32 37 T46 46" fill="none" stroke="#ffd57a" stroke-width="2.4" stroke-linecap="round"/>
      <polygon points="32,8 35,16 32,14 29,16" fill="#ffd57a"/>
    </svg>
    <div class="q-title-wrap">
      <h1 id="appTitle">結輝の2学期中間クエスト</h1>
      <div class="q-subtitle">U.S. National Parks Expedition</div>
    </div>
  </div>
  <div id="countdown"></div>
</header>
<div id="checkBanner" class="banner" style="display:none">確認モード：「要確認」の問題も表示中（解答集との照合用）</div>
<nav id="tabs">
  <button data-view="today" class="on">きょう <small>BASE CAMP</small></button>
  <button data-view="practice">問題を解く</button>
  <button data-view="review">復習 <small>リベンジ・トレイル</small></button>
  <button data-view="progress">進み具合 <small>探検ログ</small></button>
</nav>
<main id="main"><p class="muted">読み込み中…</p></main>
<div id="session" style="display:none"></div>
<div id="toast"></div>
<!-- 解き終わり達成演出（1.5秒・クリックでスキップ可・reduced-motionでは非表示） -->
<div id="questClearBanner" role="status" aria-live="polite" onclick="hideClearBanner()">
  <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="28" fill="#d99a26"/>
    <path d="M20 33 L29 42 L45 23" fill="none" stroke="#1c3a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div>
    <div style="font-size:15px;font-weight:700;">トレイル踏破おつかれさま！</div>
    <div style="font-size:12px;opacity:0.88;">ベースキャンプへ戻りました（クリックで閉じる）</div>
  </div>
</div>

<script src="api.js?v=20261122-5"></script>
<script>
/* 古い画面が残っていたら1回だけ読み直す（GitHub Pages のキャッシュ対策）。直すたびに BUILD を変える */
const BUILD = '20261122-5';
(function () {
  try {
    if (sessionStorage.getItem('reloaded') === BUILD) return;
    fetch(location.pathname + '?build=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      if (t.indexOf("const BUILD = '" + BUILD + "'") < 0) { sessionStorage.setItem('reloaded', BUILD); location.reload(); }
    }).catch(function () {});
  } catch (e) {}
})();
const CHECK_MODE = new URLSearchParams(location.search).get('mode') === 'check';
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const QUEST_TITLE = '結輝の2学期中間クエスト';

/* 教科と国立公園の対応定義（シルエットはオリジナルSVG） */
const PARKS = {
  '理科': {
    name: 'Yellowstone',
    color: '#2e6b5e',
    stampShape: 'circle',
    svg: '<svg class="park-silhouette" viewBox="0 0 240 60" preserveAspectRatio="none"><path d="M0 60 L0 44 Q45 36 85 45 T165 40 Q205 34 240 44 L240 60 Z" fill="#ffffff"/><path d="M182 44 Q186 18 190 6 Q194 18 198 44 Z" fill="#ffffff"/><circle cx="190" cy="8" r="7" fill="#ffffff" opacity="0.6"/><polygon points="34,44 42,24 50,44" fill="#ffffff"/><polygon points="52,46 62,20 72,46" fill="#ffffff"/></svg>'
  },
  '社会': {
    name: 'Grand Canyon',
    color: '#b3542d',
    stampShape: 'hex',
    svg: '<svg class="park-silhouette" viewBox="0 0 240 60" preserveAspectRatio="none"><path d="M0 60 L0 26 L55 26 L75 40 L105 40 L125 50 L145 40 L175 40 L195 22 L240 22 L240 60 Z" fill="#ffffff"/><line x1="0" y1="34" x2="240" y2="34" stroke="#000" stroke-opacity="0.18" stroke-width="2"/><line x1="0" y1="44" x2="240" y2="44" stroke="#000" stroke-opacity="0.18" stroke-width="2"/></svg>'
  },
  '数学': {
    name: 'Arches',
    color: '#c46a1f',
    stampShape: 'rect',
    svg: '<svg class="park-silhouette" viewBox="0 0 240 60" preserveAspectRatio="none"><path d="M0 60 L0 48 L125 48 L142 16 Q168 4 194 16 L210 48 L240 48 L240 60 Z M158 48 L166 26 Q168 22 172 26 L180 48 Z" fill="#ffffff" fill-rule="evenodd"/></svg>'
  },
  '国語': {
    name: 'Yosemite',
    color: '#3b5e82',
    stampShape: 'oval',
    svg: '<svg class="park-silhouette" viewBox="0 0 240 60" preserveAspectRatio="none"><path d="M0 60 L0 46 L70 36 L118 46 L146 46 L158 14 Q188 8 206 24 L218 46 L240 42 L240 60 Z" fill="#ffffff"/></svg>'
  },
  '英語': {
    name: 'Zion',
    color: '#6c6a75',
    stampShape: 'diamond',
    svg: '<svg class="park-silhouette" viewBox="0 0 240 60" preserveAspectRatio="none"><path d="M0 60 L0 20 L48 24 L76 48 L140 48 L168 18 L212 22 L240 16 L240 60 Z" fill="#ffffff"/></svg>'
  }
};
function parkOf(s) { return PARKS[s] || PARKS['理科']; }

let D = null;              // getBootstrap の結果
let view = 'today';
let practiceSubject = null;
let timer = { start: null, id: null };
let clearBannerTimer = null;
let LAUNCH = [];           // 「解く」ボタン用の出題条件
function launch(filter, label) { LAUNCH.push({ filter: filter, label: label }); return 'go(' + (LAUNCH.length - 1) + ')'; }
function go(i) { const L = LAUNCH[i]; startSession(Object.assign({}, L.filter), L.label); }

/* ---------- 共通 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function jpDate(ymd) {
  const d = new Date(ymd + 'T00:00:00Z');
  return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日（' + WD[d.getUTCDay()] + '）';
}
function hm(min) {
  min = Math.round(min);
  const h = Math.floor(min / 60), m = min % 60;
  return h ? (h + '時間' + (m ? m + '分' : '')) : m + '分';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2200);
}
function fail(e) { toast('エラー：' + (e && e.message ? e.message : e)); }

/* 解き終わり達成演出の表示・非表示 */
function hideClearBanner() {
  const b = document.getElementById('questClearBanner');
  if (b) b.classList.remove('on');
  if (clearBannerTimer) { clearTimeout(clearBannerTimer); clearBannerTimer = null; }
}
function showClearBanner() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  hideClearBanner();
  const b = document.getElementById('questClearBanner');
  if (!b) return;
  b.classList.add('on');
  clearBannerTimer = setTimeout(hideClearBanner, 1800);
}

/* レンジャー階級の判定（全体最新正答率） */
function rangerRank(doneSum, okSum) {
  if (!doneSum) return { name: 'Trail Starter', sub: '採点待ち・出発準備中' };
  const r = Math.round(okSum / doneSum * 100);
  if (r >= 90) return { name: 'Chief Ranger', sub: '全体正答率 ' + r + '%（山頂準備完了）' };
  if (r >= 75) return { name: 'Senior Ranger', sub: '全体正答率 ' + r + '%（上位キープ）' };
  if (r >= 60) return { name: 'Ranger', sub: '全体正答率 ' + r + '%（順調に踏破中）' };
  return { name: 'Junior Ranger', sub: '全体正答率 ' + r + '%（復習で伸ばそう）' };
}

/* 正答率の段階表示（色＋アイコン＋文字） */
function rateMeta(done, ok) {
  if (!done) return { cls: 'rate-none', bar: 'var(--rate-none-bar)', icon: '○', label: '未採点', pct: 0, text: '―' };
  const pct = Math.round(ok / done * 100);
  if (pct >= 80) return { cls: 'rate-high', bar: 'var(--rate-high-bar)', icon: '★', label: '良好', pct: pct, text: pct + '%' };
  if (pct >= 60) return { cls: 'rate-mid',  bar: 'var(--rate-mid-bar)',  icon: '▲', label: '順調', pct: pct, text: pct + '%' };
  return { cls: 'rate-low', bar: 'var(--rate-low-bar)', icon: '!', label: '要復習', pct: pct, text: pct + '%' };
}

/* パークスタンプSVG（完了した計画1件ごとに1つ） */
function stampSvg(p) {
  const park = parkOf(p.subject);
  const m = String(p.task || '').match(/([JMRSEX]\d{2})/);
  const code = m ? m[1] : esc(p.subject).slice(0, 2);
  const dt = p.date ? p.date.slice(5).replace('-', '/') : '';
  let frame = '';
  if (park.stampShape === 'circle') {
    frame = '<circle cx="40" cy="40" r="35" fill="none" stroke="' + park.color + '" stroke-width="3"/><circle cx="40" cy="40" r="30" fill="none" stroke="' + park.color + '" stroke-width="1" stroke-dasharray="3 2"/>';
  } else if (park.stampShape === 'hex') {
    frame = '<polygon points="40,5 71,22 71,58 40,75 9,58 9,22" fill="none" stroke="' + park.color + '" stroke-width="3"/><polygon points="40,10 66,25 66,55 40,70 14,55 14,25" fill="none" stroke="' + park.color + '" stroke-width="1"/>';
  } else if (park.stampShape === 'rect') {
    frame = '<rect x="7" y="10" width="66" height="60" rx="10" fill="none" stroke="' + park.color + '" stroke-width="3"/><rect x="12" y="15" width="56" height="50" rx="6" fill="none" stroke="' + park.color + '" stroke-width="1" stroke-dasharray="3 2"/>';
  } else if (park.stampShape === 'oval') {
    frame = '<ellipse cx="40" cy="40" rx="36" ry="29" fill="none" stroke="' + park.color + '" stroke-width="3"/><ellipse cx="40" cy="40" rx="31" ry="24" fill="none" stroke="' + park.color + '" stroke-width="1"/>';
  } else {
    frame = '<polygon points="40,5 75,40 40,75 5,40" fill="none" stroke="' + park.color + '" stroke-width="3"/>';
  }
  return '<svg class="stamp-svg" viewBox="0 0 80 80" role="img" aria-label="' + esc(park.name) + ' 完了スタンプ">'
    + '<g transform="rotate(-6 40 40)">' + frame
    + '<text x="40" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="' + park.color + '">' + esc(park.name.toUpperCase().slice(0, 10)) + '</text>'
    + '<text x="40" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="' + park.color + '">' + esc(code) + '</text>'
    + '<text x="40" y="59" text-anchor="middle" font-size="9" font-weight="700" fill="' + park.color + '">' + esc(dt) + '</text>'
    + '</g></svg>';
}

async function load() {
  D = await call('getBootstrap', CHECK_MODE);
  document.getElementById('countdown').innerHTML = D.daysLeft > 0
    ? 'SUMMIT DAY まで あと<b>' + D.daysLeft + '</b>日'
    : (D.daysLeft === 0 ? '<b>きょうが SUMMIT DAY</b>' : 'SUMMIT DAY 終了');
  render();
}

function render() {
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.view === view); });
  const main = document.getElementById('main');
  LAUNCH = [];
  main.innerHTML = ({ today: viewToday, practice: viewPractice, review: viewReview, progress: viewProgress })[view]();
  if (view === 'today') bindTimer();
}

/* ---------- きょう ---------- */
function viewToday() {
  const day = D.days.find(function (d) { return d.date === D.today; });
  const tasks = D.plan.filter(function (p) { return p.date === D.today; });
  const studied = D.log.filter(function (l) { return l.date === D.today; }).reduce(function (s, l) { return s + l.minutes; }, 0);
  const goal = day ? day.hours * 60 : 0;
  let h = progressPanel();

  /* 行動タイマー */
  h += '<section class="q-card"><div class="q-card-head"><h3>行動タイマー</h3><span class="q-card-sub">' +
    jpDate(D.today) + (day ? '　勉強できる時間 ' + day.hours + '時間' : '') + '</span></div>' +
    '<div class="timer"><select id="timerSubject">' +
    D.subjects.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') +
    '</select><button class="btn primary" id="timerBtn">はじめる</button><span id="timerClock">0:00</span>' +
    '<span>きょう ' + hm(studied) + (goal ? ' ／ ' + hm(goal) : '') + '</span>' +
    (goal ? '<div class="bar" style="width:180px"><span style="width:' + Math.min(100, studied / goal * 100) + '%"></span></div>' : '') +
    '</div></section>';

  /* 今日のミッション */
  h += '<section class="q-card"><div class="q-card-head"><h3>今日のミッション</h3><span class="q-card-sub">完了チェックで上のパークスタンプ帳が増えます</span></div>';
  if (!tasks.length) {
    h += '<p class="empty">きょうの計画はまだ入っていない</p>';
  } else {
    h += '<div class="table-wrap"><table><tr><th style="width:52px">済</th><th style="width:90px">教科</th><th>内容</th><th class="num">目安</th><th></th></tr>' +
      tasks.map(function (t) {
        const pk = parkOf(t.subject);
        return '<tr class="' + (t.done ? 'done' : '') + '"><td><input type="checkbox" ' + (t.done ? 'checked' : '') +
          ' onchange="togglePlan(' + t.row + ', this.checked)"></td><td><span class="subj-tag" style="background:' + pk.color + '">' + esc(t.subject) + '</span></td><td>' + esc(t.task) +
          '</td><td class="num">' + (t.minutes ? hm(t.minutes) : '') + '</td><td class="num">' +
          (t.filter ? '<button class="btn" onclick="' + launch({ filterText: t.filter, subject: t.subject }, t.subject + '：' + t.task) + '">解く</button>' : '') + '</td></tr>';
      }).join('') + '</table></div>';
  }
  h += '</section>';

  /* ルートプラン（これからの予定） */
  const upcoming = D.days.filter(function (d) { return d.date > D.today; });
  if (upcoming.length) {
    h += '<section class="q-card"><div class="q-card-head"><h3>ルートプラン</h3><span class="q-card-sub">これからの予定</span></div>' +
      '<div class="table-wrap"><table><tr><th>日付</th><th class="num">勉強できる時間</th><th>やること</th></tr>' +
      upcoming.map(function (d) {
        const ts = D.plan.filter(function (p) { return p.date === d.date; });
        return '<tr><td>' + jpDate(d.date) + '</td><td class="num">' + d.hours + '時間</td><td>' +
          (ts.length ? '<div class="plist">' + ts.map(function (t) {
            return '<div><span class="ps">' + esc(t.subject) + '</span><span class="pt">' + esc(t.task) + '</span><span class="pm">' + (t.minutes ? t.minutes + '分' : '') + '</span></div>';
          }).join('') + '</div>' : '<span class="muted">未定</span>') + '</td></tr>';
      }).join('') + '</table></div></section>';
  }
  return h;
}

/* 探検マップ（全体トレイル・レンジャー階級・5公園カード・パークスタンプ帳） */
function progressPanel() {
  const by = {};
  D.index.forEach(function (g) {
    const b = by[g.subject] || (by[g.subject] = { total: 0, done: 0, ok: 0 });
    b.total += g.total; b.done += g.done; b.ok += (g.last != null ? g.last : g.mastered);
  });
  const order = ['理科', '社会', '数学', '国語', '英語'];
  const subs = order.filter(function (s) { return D.subjects.indexOf(s) >= 0 || by[s]; })
    .concat(D.subjects.filter(function (s) { return order.indexOf(s) < 0 && by[s]; }));
  const T = subs.reduce(function (a, s) {
    const b = by[s];
    return b ? { total: a.total + b.total, done: a.done + b.done, ok: a.ok + b.ok } : a;
  }, { total: 0, done: 0, ok: 0 });
  const ratio = T.total ? (T.done / T.total) : 0;
  const pctAll = (ratio * 100).toFixed(1);
  const xPos = Math.round(22 + (564 - 22) * Math.min(1, ratio));
  const rank = rangerRank(T.done, T.ok);

  let h = '<section class="map-panel" aria-label="探検マップ">' +
    '<div class="map-top-row"><div class="map-heading"><h2>探検マップ</h2><span class="map-heading-sub">5つの国立公園をめぐり山頂アタックへ</span></div>' +
    (D.lastAnalyzed ? '<div class="last-analyzed">最新の採点反映 ' + esc(D.lastAnalyzed) + '（毎晩23:30に更新）</div>' : '') +
    '</div>';

  /* 全体トレイル ＋ レンジャー階級バッジ */
  h += '<div class="trail-and-rank">' +
    '<div class="trail-box">' +
      '<div class="trail-meta"><span class="trail-label">全体トレイル踏破状況</span>' +
        '<div class="trail-numbers"><span class="trail-pct">' + pctAll + '%</span><span class="trail-count">' + T.done + '／' + T.total + '問</span></div>' +
      '</div>' +
      '<div class="trail-svg-wrap"><svg viewBox="0 0 600 72" width="100%" height="72" role="img" aria-label="全体トレイル進捗">' +
        '<path d="M558 52 L574 22 L590 52 Z" fill="#c96828" opacity="0.88"/>' +
        '<path d="M574 22 L579 31 L574 29 L569 31 Z" fill="#ffffff"/>' +
        '<line x1="18" y1="54" x2="18" y2="32" stroke="#6c7b72" stroke-width="2.5"/>' +
        '<polygon points="18,32 32,37 18,42" fill="#2a5c47"/>' +
        '<line x1="22" y1="52" x2="564" y2="52" stroke="var(--trail-track)" stroke-width="8" stroke-linecap="round"/>' +
        '<line x1="22" y1="52" x2="' + xPos + '" y2="52" stroke="var(--trail-fill)" stroke-width="8" stroke-linecap="round"/>' +
        '<circle cx="157" cy="52" r="3" fill="#ffffff" opacity="0.75"/>' +
        '<circle cx="293" cy="52" r="3" fill="#ffffff" opacity="0.75"/>' +
        '<circle cx="428" cy="52" r="3" fill="#ffffff" opacity="0.75"/>' +
        '<g transform="translate(' + xPos + ', 0)">' +
          '<circle cx="0" cy="24" r="15" fill="#c96828" stroke="#ffffff" stroke-width="2.5"/>' +
          '<circle cx="0" cy="18" r="3.2" fill="#ffffff"/>' +
          '<path d="M-4 30 L-1 23 L3 25 L5 31 M-1 23 L-4 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>' +
          '<polygon points="-5,38 5,38 0,46" fill="#c96828"/>' +
        '</g>' +
      '</svg></div>' +
      '<div class="trail-endpoints"><span>BASE CAMP（登山口）</span><span>SUMMIT（' + esc(D.testDate ? Number(D.testDate.slice(5, 7)) + '/' + Number(D.testDate.slice(8, 10)) : '12/3') + ' 山頂）</span></div>' +
    '</div>' +
    '<div class="rank-card">' +
      '<svg class="rank-emblem" viewBox="0 0 64 64" aria-hidden="true">' +
        '<polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="#2b5744" stroke="#ffd57a" stroke-width="3"/>' +
        '<polygon points="32,11 50,21 50,43 32,53 14,43 14,21" fill="none" stroke="rgba(255,213,122,0.45)" stroke-width="1.2"/>' +
        '<path d="M18 40 L28 24 L35 34 L40 27 L47 40 Z" fill="#ffd57a"/>' +
        '<polygon points="32,14 34,19 39,19 35,22 36.5,27 32,24 27.5,27 29,22 25,19 30,19" fill="#ffffff"/>' +
      '</svg>' +
      '<div><div class="rank-kicker">RANGER RANK</div><div class="rank-title">' + esc(rank.name) + '</div><div class="rank-sub">' + esc(rank.sub) + '</div></div>' +
    '</div>' +
  '</div>';

  /* 公園カード（教科ごと） */
  h += '<div class="park-grid">' + subs.map(function (s) {
    const pk = parkOf(s);
    const b = by[s];
    if (!b || !b.total) {
      return '<article class="park-card is-soon">' +
        '<div class="park-banner" style="background:' + pk.color + '">' +
          '<div class="park-banner-top"><span class="park-subject-tag">' + esc(s) + '</span><span class="park-subject-tag">準備中</span></div>' +
          '<div class="park-name">' + esc(pk.name) + '</div>' + pk.svg +
        '</div>' +
        '<div class="park-card-body"><div class="soon-box"><strong>トレイル整備中</strong><br>問題を準備中</div></div>' +
      '</article>';
    }
    const coverPct = Math.round(b.done / b.total * 100);
    const rm = rateMeta(b.done, b.ok);
    return '<article class="park-card">' +
      '<div class="park-banner" style="background:' + pk.color + '">' +
        '<div class="park-banner-top"><span class="park-subject-tag">' + esc(s) + '</span><span class="rate-chip ' + rm.cls + '">' + rm.icon + ' ' + rm.label + '</span></div>' +
        '<div class="park-name">' + esc(pk.name) + '</div>' + pk.svg +
      '</div>' +
      '<div class="park-card-body">' +
        '<div class="gauge-block"><div class="gauge-head"><span class="gauge-name">踏破率</span><span class="gauge-val">' + coverPct + '% (' + b.done + '/' + b.total + ')</span></div>' +

function bindTimer() {
  const btn = document.getElementById('timerBtn');
  if (timer.start) { btn.textContent = 'おわる'; tick(); }
  btn.onclick = async function () {
    if (!timer.start) {
      timer.start = Date.now();
      timer.subject = document.getElementById('timerSubject').value;
      timer.id = setInterval(tick, 1000);
      btn.textContent = 'おわる';
    } else {
      clearInterval(timer.id);
      const min = (Date.now() - timer.start) / 60000;
      const subject = timer.subject;
      timer = { start: null, id: null };
      if (min >= 1) {
        await call('logStudy', subject, min).catch(fail);
        toast(subject + ' ' + hm(min) + ' を記録した');
        await load();
      } else {
        toast('1分未満なので記録しない');
        render();
      }
    }
  };
}
function tick() {
  const el = document.getElementById('timerClock');
  if (!el || !timer.start) return;
  const s = Math.floor((Date.now() - timer.start) / 1000);
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const sel = document.getElementById('timerSubject');
  if (sel) { sel.value = timer.subject; sel.disabled = true; }
}

/* 分数を縦書きで表示（例：(2/3)x → 2を3の上に） */
function fmt(t, math) {
  const F = '([0-9A-Za-z]+[₀-₉]*)';
  let h = esc(t)
    .replace(new RegExp('\\(' + F + '\\/' + F + '\\)', 'g'), '<span class="frac"><span>$1</span><span>$2</span></span>')
    .replace(new RegExp('(^|[^0-9A-Za-z₀-₉])' + F + '\\/' + F + '(?![0-9A-Za-z])', 'g'), '$1<span class="frac"><span>$2</span><span>$3</span></span>');
  if (math) h = h.replace(/(^|[^A-Za-z<\/"=])([xyabn]{1,2})(?![A-Za-z])/g, function (m, p, v) { return p + v.split('').map(function (c) { return '<i class="v">' + c + '</i>'; }).join(''); });
  return h;
}

/* 用紙番号：教科の1文字＋番号（例 J01）。計画の番号をそのまま使い、計画外は51番から */
const SUBJ_CODE = { '国語': 'J', '数学': 'M', '理科': 'R', '社会': 'S', '英語': 'E' };
function sheetCode(qs, label) {
  const m = String(label || '').match(/([JMRSEX]\d{2})(?!\d)/);
  if (m) return m[1];
  const subs = Array.from(new Set(qs.map(function (q) { return q.subject; })));
  const c = subs.length === 1 ? (SUBJ_CODE[subs[0]] || 'X') : 'X';
  let n = 51;
  try { n = Number(localStorage.getItem('sheetNo_' + c) || 50) + 1; localStorage.setItem('sheetNo_' + c, String(n)); } catch (e) {}
  return c + ('0' + n).slice(-2);
}

const BARE_LABEL = /^[ア-コA-Z①-⑩]$/;
function prepChoices(q) {
  if (!q.choices.length || !q.choices.every(function (c) { return BARE_LABEL.test(c.trim()); })) return;
  const labs = q.choices.map(function (c) { return c.trim(); });
  const pos = [];
  let from = 0;
  for (let k = 0; k < labs.length; k++) {
    const re = new RegExp('(^|[\\s　。])' + labs[k] + '[\\s　]*(?=\\S)', 'g');
    re.lastIndex = from;
    const m = re.exec(q.prompt);
    if (!m) break;
    pos.push({ i: m.index + m[1].length, j: re.lastIndex });
    from = re.lastIndex;
  }
  if (pos.length === labs.length) {
    q.choices = labs.map(function (l, k) { return l + ' ' + q.prompt.slice(pos[k].j, k + 1 < pos.length ? pos[k + 1].i : undefined).trim(); });
    q.prompt = q.prompt.slice(0, pos[0].i).trim();
  } else {
    q.hideChoices = true;
  }
}

/* 選択問題の答えは記号で出す（例：ア（倉敷））。記号は問題用紙に表示したものと同じ */
const CH_KANA = ['ア', 'イ', 'ウ', 'エ', 'オ', 'カ', 'キ', 'ク', 'ケ', 'コ'];
const CH_LBL = /^[ア-コA-Za-z①-⑩]([^ァ-ヶー]|$)/;
function choiceAnswer(choices, ans) {
  const norm = function (t) { return String(t).normalize('NFKC').replace(/[\s　]/g, ''); };
  const labeled = choices.every(function (c) { return CH_LBL.test(c); });
  const items = choices.map(function (c, k) {
    return labeled ? { lab: c[0], text: c.slice(1).replace(/^[\s　．.:：、]+/, ''), full: c } : { lab: CH_KANA[k], text: c, full: c };
  });
  const one = function (t) {
    const n = norm(t);
    if (!n) return null;
    return items.find(function (x) { return norm(x.full) === n; }) || items.find(function (x) { return norm(x.text) === n; }) ||
      (n.length === 1 ? items.find(function (x) { return x.lab === n; }) : null) || null;
  };
  const show = function (x) {
    let t = x.text;
    if (!t) return x.lab;
    /* 「AとC」「ア→エ→イ」「A′」のように記号のすぐ後に続く選択肢は、記号と中身に分けずにそのまま出す */
    if (/^[（(]/.test(t) || (labeled && !/^[ア-コA-Za-z①-⑩]([\s　．.:：、]|$)/.test(x.full))) return x.full;
    if (t.length > 20) t = t.slice(0, 20) + '…';
    return x.lab + '（' + t + '）';
  };
  const hit = one(ans);
  if (hit) return show(hit);
  const parts = String(ans).split(/[、,，・]/).filter(Boolean);
  if (parts.length > 1) {
    const hs = parts.map(one);
    if (hs.every(Boolean)) return hs.map(show).join('、');
  }
  return null;
}

function answerHtml(a, math, q) {
  if (/^img:/.test(a.answer)) {
    return '<div class="ans">答え（解答集）' + a.answer.slice(4).split(',').map(function (id) {
      return '<div class="pageimg" data-fig="' + esc(id.trim()) + '">読み込み中…</div>';
    }).join('') + '</div>';
  }
  if (a.type === 'ページ' && !a.answer) return '<div class="ans">答えは解答集で確かめる（アプリにはまだ入っていない）</div>';
  const ch = q && q.choices && q.choices.length ? choiceAnswer(q.choices, a.answer) : null;
  return '<div class="ans">' + (a.type === '記述' ? '答えの例：' : '答え：') + (ch ? '<b>' + fmt(ch, math) + '</b>' : fmt(a.answer, math)) +
    (a.explanation ? '<small>' + fmt(a.explanation, math) + '</small>' : '') + '</div>';
}

/* ワークのページ写真：自動で読み込み、クリックで拡大 */
const FIGP = {};
let figRunning = 0; const figQueue = [];
function figSlot(fn) {
  return new Promise(function (res, rej) {
    figQueue.push(function () { figRunning++; fn().then(res, rej).finally(function () { figRunning--; if (figQueue.length) figQueue.shift()(); }); });
    if (figRunning < 4) figQueue.shift()();
  });
}
function getFig(id) {
  if (FIG[id]) return Promise.resolve(FIG[id]);
  if (!FIGP[id]) FIGP[id] = figSlot(function () { return call('getFigure', id); }).then(function (d) { FIG[id] = d; return d; }, function (e) { delete FIGP[id]; throw e; });
  return FIGP[id];
}
function loadPageImgs() {
  document.querySelectorAll('.figimg[data-fig]').forEach(async function (box) {
    const id = box.dataset.fig;
    box.removeAttribute('data-fig');
    try {
      const src = await getFig(id);
      box.innerHTML = '<img alt="図" src="' + src + '" onclick="openLightbox(this.src)">';
    } catch (e) { box.innerHTML = '図を読み込めない <button class="btn" onclick="this.parentNode.dataset.fig=\'' + esc(id) + '\';loadPageImgs()">もう一度</button>'; }
  });
  document.querySelectorAll('.pageimg[data-fig]').forEach(async function (box) {
    const id = box.dataset.fig;
    box.removeAttribute('data-fig');
    try {
      const src = await getFig(id);
      box.innerHTML = '<img alt="ページ" src="' + src + '" onclick="openLightbox(this.src)">';
    } catch (e) { box.textContent = '写真を読み込めない'; }
  });
}

const FIG = {};
function openLightbox(src) {

    lb.innerHTML = '<img alt="拡大">';
    lb.onclick = closeLightbox;
    document.body.appendChild(lb);
  }
  lb.querySelector('img').src = src;
  lb.classList.add('on');
}
function closeLightbox() { const lb = document.getElementById('lightbox'); if (lb) lb.classList.remove('on'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });
async function toggleFigure(btn) {
  const box = btn.nextElementSibling, id = btn.dataset.fig;
  if (box.innerHTML) { box.innerHTML = ''; btn.textContent = '図を見る'; return; }
  if (!FIG[id]) {
    btn.disabled = true; btn.textContent = '読み込み中…';
    try { FIG[id] = await call('getFigure', id); } catch (e) { btn.disabled = false; btn.textContent = '図を見る'; return fail(e); }
    btn.disabled = false;
  }
  box.innerHTML = '<img alt="図" src="' + FIG[id] + '">';
  btn.textContent = '図をとじる';
}

/* ---------- 起動 ---------- */
document.querySelectorAll('#tabs button').forEach(function (b) {
  b.onclick = function () { view = b.dataset.view; render(); };
});
if (CHECK_MODE) document.getElementById('checkBanner').style.display = 'block';
startApp(function (title) {
  document.title = QUEST_TITLE;
  document.getElementById('appTitle').textContent = QUEST_TITLE;
  load().catch(fail);
});
</script>
